[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vector-intelligence"
version = "0.1.0"
description = "VECTOR computational intelligence engine - Evolutionary-Fuzzy Trust Scoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.2.0",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "matplotlib>=3.10.0",
]

evolution = [
    "deap>=1.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true